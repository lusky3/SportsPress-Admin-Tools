services:
  wordpress:
    image: ghcr.io/lusky3/sportspress-sandbox/sportspress-test-env:latest
    container_name: spsg-test-env
    ports:
      - "8080:80"
    environment:
      SPORTSPRESS_SPORT: ice-hockey
    volumes:
      # Mount the plugin into WordPress
      - ../../:/var/www/html/wp-content/plugins/sportspress-schedule-generator
      # Mount test scripts
      - ./scripts:/test-scripts
