sonar.projectKey=lusky3_SportsPress-Admin-Tools
sonar.organization=lusk
sonar.sources=.
sonar.exclusions=**/vendor/**,**/assets/**,**/tests/**
sonar.php.exclusions=**/vendor/**,**/tests/**
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S101
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S116
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S4833
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.php
# Produced by `./run-coverage.sh` (see code-quality.yml's sonarcloud job, which
# generates it fresh in the same checkout immediately before this analysis runs).
# Every registered suite from run-all-tests.sh is executed under PCOV and the
# per-suite snapshots merged into one Clover report.
sonar.php.coverage.reportPaths=coverage/clover.xml

# No JavaScript coverage: the repo has no JS test suite. sonar.javascript.lcov
# .reportPaths is deliberately absent rather than pointing at a file nothing
# writes, which is what left this whole block commented out before.

# bin/coverage/** is the tooling that PRODUCES the report above — it measures
# the rest of the repo and, by construction, never measures itself. Excluded
# from the *coverage* metric only, not from analysis: bug and code-smell rules
# still apply to it, unlike the **/tests/** in sonar.exclusions above, which is
# excluded from analysis entirely.
sonar.coverage.exclusions=bin/coverage/**,scripts/debug/**
