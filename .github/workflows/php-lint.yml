name: PHP Lint & Standards

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'phpcs.xml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - 'phpcs.xml'

# Least-privilege default token: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv

      - name: Install PHP_CodeSniffer + WordPress Coding Standards
        run: |
          # Install phpcs via composer (not the setup-php PHAR) so WPCS registers
          # its standards into the same vendor tree phpcs resolves from.
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require "squizlabs/php_codesniffer" "wp-coding-standards/wpcs"
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Verify WordPress standard is installed
        run: |
          # Fail loudly if the 'WordPress' standard phpcs.xml references is missing.
          phpcs -i
          phpcs -i | grep -q WordPress

      - name: PHP Syntax Lint
        run: |
          # xargs propagates a non-zero exit if any `php -l` fails — unlike
          # `find -exec`, which swallows the exit code and merges parse errors green.
          find . -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -r -n1 -P4 php -l

      - name: Run PHPCS
        run: phpcs
