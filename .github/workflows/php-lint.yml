name: PHP Lint & Standards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv
          tools: phpcs

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require "wp-coding-standards/wpcs"
          # PHPCS standards are usually located in ~/.composer/vendor/wp-coding-standards/wpcs
          phpcs -i

      - name: Run PHPCS
        run: |
          # Use -n to hide warnings, or -s to show sniff names
          # Setting continue-on-error: true so we get the results without blocking the build if there are just minor style issues
          phpcs -p -s --standard=WordPress --extensions=php --ignore=*/vendor/*,*/assets/*,*/tests/* .
        continue-on-error: true
