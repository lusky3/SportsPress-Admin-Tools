name: Code Quality (SonarCloud)

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
      - 'sonar-project.properties'
      - 'composer.json'
      - 'run-coverage.sh'
      - 'run-all-tests.sh'
      - 'bin/coverage/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.php'
      - '**/*.js'
      - 'sonar-project.properties'
      - 'composer.json'
      - 'run-coverage.sh'
      - 'run-all-tests.sh'
      - 'bin/coverage/**'

# Least-privilege default token: the scan only reads the repo (and GITHUB_TOKEN
# for PR metadata, which needs no more than read).
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # Coverage has to be produced in this checkout, before the scan step, so
      # sonar.php.coverage.reportPaths finds coverage/clover.xml where it looks.
      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: pcov
          extensions: mbstring, xml, ctype, iconv, zip

      - name: Install coverage tooling
        run: composer install --no-interaction --no-progress

      # The suite must pass for its coverage to mean anything, and this script
      # exits non-zero if any suite fails — so a broken test fails the job here
      # rather than quietly reporting reduced coverage.
      - name: Generate coverage report
        run: ./run-coverage.sh

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
