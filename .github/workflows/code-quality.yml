name: Code Quality (SonarCloud)

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
      - 'sonar-project.properties'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.php'
      - '**/*.js'
      - 'sonar-project.properties'

# Least-privilege default token: the scan only reads the repo (and GITHUB_TOKEN
# for PR metadata, which needs no more than read).
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: pcov
      - name: Generate PHP coverage (Clover)
        # Runs the standalone suites under PCOV and merges them into
        # coverage/clover.xml. Best-effort: test correctness is gated by the
        # ci-tests workflow, so a suite hiccup here must not block the scan.
        run: bash tools/coverage/run.sh coverage/clover.xml || echo "coverage run reported failures; proceeding with partial report"
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
