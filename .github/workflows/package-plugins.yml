name: Package & Release Plugins

on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  # Refuse to publish a plugin whose SHIPPED code changed since the previous tag
  # without a version bump and a matching changelog entry. Runs before packaging
  # so a mislabelled release never produces a zip at all — a release that exists
  # but is wrong is worse than one that failed to build, because people download
  # the former.
  #
  # Changes confined to tests/, docs/ and the rest of .distignore do NOT demand a
  # bump: forcing one for work no user receives would train everyone to bump
  # meaninglessly, which defeats the guard.
  release-guard:
    runs-on: ubuntu-latest
    # The guard only reads the repository and its tags; it publishes nothing.
    # Without this it inherits the repository default, which is wider than the
    # job needs and wider than every other workflow here declares.
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guard compares this tag against the previous one, so it needs
          # the full history and every tag. The default shallow clone has
          # neither and would silently pass everything.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"

      - name: Verify the guard's own logic still holds
        run: php tests/test-release-guard.php

      - name: Check every plugin is labelled for release
        run: php scripts/release-guard.php --verbose

  package:
    needs: release-guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"

      - name: Create Zips
        run: |
          mkdir -p dist
          for dir in sportspress-*; do
            if [ -d "$dir" ]; then
              echo "Packaging $dir..."
              # Exclusions come from the plugin's own .distignore — the single
              # source of truth that scripts/release-guard.php also reads. This
              # used to be a hand-copied list of -x patterns, which drifted out
              # of step with .distignore and with the guard in both directions.
              #
              # A plugin with no .distignore ships everything; the guard treats
              # that same missing file the same way, so the two agree even in
              # the degenerate case.
              excludes=()
              if [ -f "$dir/.distignore" ]; then
                while IFS= read -r line || [ -n "$line" ]; do
                  line="${line%%#*}"
                  line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                  [ -z "$line" ] && continue
                  line="${line#/}"
                  # Both forms: the entry itself, and anything beneath it when
                  # the entry names a directory.
                  excludes+=( "$dir/$line" "$dir/$line/*" )
                done < "$dir/.distignore"
              fi
              zip -r "dist/${dir}.zip" "$dir" -x "${excludes[@]}"
            fi
          done

      # The in-plugin updater reads this. One release tag carries eight
      # independently-versioned plugins, so a plugin cannot learn its own
      # version from the tag it appears in — the manifest is where that
      # question is answered. Built from the same parsing the release guard
      # above uses, so the two cannot disagree about what version anything is.
      - name: Build the update manifest
        run: php scripts/build-manifest.php "${GITHUB_REF_NAME}" dist/manifest.json

      # Publish checksums alongside the zips so consumers can verify a download
      # against the release page instead of trusting the transport alone.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify league-manager bundle is present in its zip
        run: |
          # Regression guard: a mis-scoped -x pattern must never strip the
          # compiled dashboard that the plugin cannot run without.
          for f in build/index.js build/index.css build/index.asset.php; do
            if ! unzip -l dist/sportspress-league-manager.zip \
                 | grep -q "sportspress-league-manager/$f"; then
              echo "::error::sportspress-league-manager/$f is missing from the release zip."
              exit 1
            fi
          done
          echo "League manager build/ bundle present in the release zip."

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
