name: WordPress Plugin Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '.github/workflows/wp-plugin-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - '.github/workflows/wp-plugin-check.yml'

# Least-privilege default token: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The child plugins wp_die() on standalone activation because they
      # require the SPAT_Plugin_Manager parent. The wordpress/plugin-check-action
      # activates each plugin in isolation and can't pre-activate a dependency
      # that isn't on wordpress.org, so it fails for every child. Instead we run
      # Plugin Check via wp-env: the parent framework (and the Plugin Check
      # plugin) are activated, and the whole suite is mapped into the site so
      # `wp plugin check` can analyse each plugin — active or not — with the
      # parent present.
      # Plugin Check is pinned: `latest-stable` let a new release (2.2.0 added the
      # React usage check) turn CI red with no change in this repo. Bump the
      # version below deliberately; Dependabot cannot see it.
      - name: Configure wp-env
        run: |
          cat > .wp-env.json <<'JSON'
          {
            "plugins": [
              "./sportspress-admin-tools",
              "https://downloads.wordpress.org/plugin/plugin-check.2.2.0.zip"
            ],
            "mappings": {
              "wp-content/plugins/sportspress-player-app": "./sportspress-player-app",
              "wp-content/plugins/sportspress-freescout-bridge": "./sportspress-freescout-bridge",
              "wp-content/plugins/sportspress-etransfer-automation": "./sportspress-etransfer-automation",
              "wp-content/plugins/sportspress-events-manager": "./sportspress-events-manager",
              "wp-content/plugins/sportspress-league-manager": "./sportspress-league-manager",
              "wp-content/plugins/sportspress-player-registration": "./sportspress-player-registration",
              "wp-content/plugins/sportspress-player-tools": "./sportspress-player-tools",
              "wp-content/plugins/sportspress-schedule-generator": "./sportspress-schedule-generator",
              "wp-content/plugins/sportspress-score-sheets": "./sportspress-score-sheets"
            }
          }
          JSON

      - name: Start wp-env
        run: npx --yes @wordpress/env@11.12.0 start

      # `wp plugin check` always exits 0 (it reports findings, it doesn't gate on
      # them), so we parse the CSV output and fail on any ERROR row. Warnings and
      # the i18n_usage check are excluded to match the previous configuration;
      # tests/ and docs/ are out of scope, and so are
      # Player App's un-built app/ source and node_modules/ (its .distignore keeps
      # them out of the zip; the committed build/ is what ships and is checked).
      #
      # Player App only: inlined_react_dom is ignored. Its build/ bundles React
      # 19.3.1 on purpose: the app is a standalone PWA served by its own shell
      # (includes/class-app-shell.php), where WordPress's scripts are never
      # loaded, so there is no wp.element React to externalize to. The check
      # misreads the bundle as pre-React-19 (it carries React 19's own
      # "19.3.1" version guard). Every other check still runs on it.
      - name: Run Plugin Check on all suite plugins
        run: |
          set -uo pipefail
          plugins="sportspress-admin-tools sportspress-player-app sportspress-freescout-bridge sportspress-etransfer-automation sportspress-events-manager sportspress-league-manager sportspress-player-registration sportspress-player-tools sportspress-schedule-generator sportspress-score-sheets"
          fail=0
          for p in $plugins; do
            ignore_codes=""
            if [ "$p" = "sportspress-player-app" ]; then
              ignore_codes="inlined_react_dom"
            fi
            echo "::group::Plugin Check: $p"
            out=$(npx --yes @wordpress/env@11.12.0 run cli wp plugin check "$p" \
              --categories=general \
              --exclude-directories=tests,docs,app,node_modules \
              --ignore-warnings \
              --exclude-checks=i18n_usage \
              ${ignore_codes:+--ignore-codes=$ignore_codes} \
              --format=csv 2>/dev/null)
            echo "$out"
            if printf '%s\n' "$out" | grep -q ',ERROR,'; then
              echo "::error::Plugin Check found ERROR-level issues in $p"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "Plugin Check failed — see the ERROR rows above."
            exit 1
          fi
          echo "Plugin Check passed for all plugins."

      - name: Stop wp-env
        if: always()
        run: npx --yes @wordpress/env@11.12.0 stop