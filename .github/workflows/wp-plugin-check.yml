name: WordPress Plugin Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'

# Least-privilege default token: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - sportspress-admin-tools
          - sportspress-etransfer-automation
          - sportspress-events-manager
          - sportspress-league-manager
          - sportspress-player-registration
          - sportspress-player-tools
          - sportspress-schedule-generator
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@6f5a57e173c065a394b78688f75df543e4011902 # v1.1.5
        with:
          build-dir: ${{ matrix.plugin }}
          ignore-warnings: 'true'
          exclude-directories: tests,docs
          categories: general
          exclude-checks: i18n_usage
