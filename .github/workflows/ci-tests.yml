name: Docker CI Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'sportspress-league-manager/src/**'
      # The committed bundle must be in the filter too, otherwise a change that
      # touches ONLY build/index.js|.css never triggers this workflow and the
      # build-drift gate below never runs — a tampered bundle would ship
      # unchecked. See audit H2.
      - 'sportspress-league-manager/build/**'
      - 'sportspress-league-manager/templates/**'
      - 'sportspress-league-manager/assets/**'
      - 'sportspress-league-manager/package.json'
      - 'sportspress-league-manager/package-lock.json'
      # Bench's committed build/ must be in the filter for the same reason as
      # League Manager's above: a change touching only the bundle would
      # otherwise skip the drift gate.
      - 'sportspress-bench/app/**'
      - 'sportspress-bench/build/**'
      - '.github/workflows/ci-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - 'sportspress-league-manager/src/**'
      - 'sportspress-league-manager/build/**'
      - 'sportspress-league-manager/templates/**'
      - 'sportspress-league-manager/assets/**'
      - 'sportspress-league-manager/package.json'
      - 'sportspress-league-manager/package-lock.json'
      - 'sportspress-bench/app/**'
      - 'sportspress-bench/build/**'
      - '.github/workflows/ci-tests.yml'

# Least-privilege default token: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes) to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Standalone PHP Tests
        # Delegate to run-all-tests.sh — the single source of truth for the unit
        # suite. It checks each suite's process exit code (not a grep for a
        # "Failed: N" string, which a fatal error / crash never prints) and runs
        # the full list, including test-exporters.php and test-constraints.php
        # that the previous inline list silently omitted.
        run: bash run-all-tests.sh

  docker-integration-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Run Tests
        working-directory: sportspress-schedule-generator/tests/docker
        run: |
          sed -i 's/\r$//' run-tests.sh
          chmod +x run-tests.sh
          sed -i 's/sleep 45/sleep 60/' run-tests.sh
          ./run-tests.sh

  league-manager-build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # run-all-tests.sh runs in php-cli containers without node and skips
      # its JS tests there, so the [arl_schedule] client logic runs here.
      - name: Dynamic Schedule JS logic tests
        run: node sportspress-events-manager/tests/dynamic-schedule-logic.test.js

      # The build/ bundle is committed to the repo, so it must stay in sync with
      # src/. First verify the artifacts exist, then fail if a rebuild produced
      # output that differs from what was committed (drift / tamper gate).
      - name: Build and verify output
        working-directory: sportspress-league-manager
        run: |
          npm ci
          npm run build
          for f in build/index.js build/index.css build/index.asset.php; do
            if [ ! -s "$f" ]; then
              echo "::error::Expected build artifact $f was not produced by 'npm run build'."
              exit 1
            fi
          done

      - name: Fail if committed bundle drifted from source
        run: |
          if ! git diff --exit-code sportspress-league-manager/build/; then
            echo "::error::Committed sportspress-league-manager/build/ is out of sync with src/. Run 'npm run build' in sportspress-league-manager and commit the result."
            exit 1
          fi

  bench-build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Bench's build/ is committed (the PHP app shell serves it as-is), so it
      # must stay in sync with app/. Tests first, then build, then verify the
      # artifacts the shell cannot run without, then the drift gate.
      - name: Test and build the Bench app
        working-directory: sportspress-bench/app
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify Bench build artifacts
        run: |
          for f in sportspress-bench/build/.vite/manifest.json sportspress-bench/build/sw.js; do
            if [ ! -s "$f" ]; then
              echo "::error::Expected build artifact $f was not produced by 'npm run build' in sportspress-bench/app."
              exit 1
            fi
          done

      # git diff alone misses new files, and hashed bundle names change on every
      # source change, so also fail on untracked files under build/.
      - name: Fail if committed Bench bundle drifted from source
        run: |
          untracked="$(git ls-files --others --exclude-standard -- sportspress-bench/build/)"
          if ! git diff --exit-code sportspress-bench/build/ || [ -n "$untracked" ]; then
            [ -n "$untracked" ] && printf 'Untracked build output:\n%s\n' "$untracked"
            echo "::error::Committed sportspress-bench/build/ is out of sync with app/. Run 'npm ci && npm run build' in sportspress-bench/app and commit the result."
            exit 1
          fi
