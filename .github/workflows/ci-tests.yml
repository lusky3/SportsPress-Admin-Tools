name: Docker CI Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'

jobs:
  php-tests:
    runs-on: ubuntu-latest
    container:
      image: php:8.2-cli
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Standalone PHP Tests
        run: php sportspress-schedule-generator/tests/run-tests.php

  docker-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Tests
        working-directory: sportspress-schedule-generator/tests/docker
        run: |
          # Convert line endings to LF to ensure execution on linux
          sed -i 's/\r$//' run-tests.sh
          chmod +x run-tests.sh
          # Increase timeout for the CI environment
          sed -i 's/sleep 45/sleep 60/' run-tests.sh
          ./run-tests.sh
