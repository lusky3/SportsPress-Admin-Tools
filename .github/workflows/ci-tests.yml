name: Docker CI Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'sportspress-league-manager/src/**'
      - 'sportspress-league-manager/templates/**'
      - 'sportspress-league-manager/assets/**'
      - 'sportspress-league-manager/package.json'
      - 'sportspress-league-manager/package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - 'sportspress-league-manager/src/**'
      - 'sportspress-league-manager/templates/**'
      - 'sportspress-league-manager/assets/**'
      - 'sportspress-league-manager/package.json'
      - 'sportspress-league-manager/package-lock.json'

jobs:
  php-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Standalone PHP Tests
        # Delegate to run-all-tests.sh — the single source of truth for the unit
        # suite. It checks each suite's process exit code (not a grep for a
        # "Failed: N" string, which a fatal error / crash never prints) and runs
        # the full list, including test-exporters.php and test-constraints.php
        # that the previous inline list silently omitted.
        run: bash run-all-tests.sh

  docker-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Run Tests
        working-directory: sportspress-schedule-generator/tests/docker
        run: |
          sed -i 's/\r$//' run-tests.sh
          chmod +x run-tests.sh
          sed -i 's/sleep 45/sleep 60/' run-tests.sh
          ./run-tests.sh

  league-manager-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # build/ is gitignored, so `git diff --exit-code build/` would always pass
      # regardless of whether the build actually produced output. Verify the
      # generated artifacts exist instead — if npm run build emits nothing,
      # this job fails with a clear message.
      - name: Build and verify output
        working-directory: sportspress-league-manager
        run: |
          npm ci
          npm run build
          for f in build/index.js build/index.css build/index.asset.php; do
            if [ ! -s "$f" ]; then
              echo "::error::Expected build artifact $f was not produced by 'npm run build'."
              exit 1
            fi
          done
