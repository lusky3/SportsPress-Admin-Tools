name: Docker CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Tests
        working-directory: sportspress-schedule-generator/tests/docker
        run: |
          chmod +x run-tests.sh
          # Increase timeout for the CI environment
          sed -i 's/sleep 45/sleep 60/' run-tests.sh
          ./run-tests.sh
