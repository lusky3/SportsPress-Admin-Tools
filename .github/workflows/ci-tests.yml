name: Docker CI Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'sportspress-league-manager/src/**'
      - 'sportspress-league-manager/package.json'
      - 'sportspress-league-manager/package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - 'sportspress-league-manager/src/**'
      - 'sportspress-league-manager/package.json'
      - 'sportspress-league-manager/package-lock.json'

jobs:
  php-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Standalone PHP Tests
        run: |
          failed=0
          for test in \
            sportspress-etransfer-automation/tests/test-name-matcher.php \
            sportspress-etransfer-automation/tests/test-etransfer-automation.php \
            sportspress-player-registration/tests/test-registration-logic.php \
            sportspress-player-tools/tests/test-batch-list-creator.php \
            sportspress-schedule-generator/tests/test-matchup-generator.php \
            sportspress-league-manager/tests/test-league-manager.php; do
            echo "--- Running $(basename $test) ---"
            output=$(php "$test" 2>&1)
            echo "$output"
            if echo "$output" | grep -q "Failed: [1-9]"; then
              failed=1
            fi
            echo ""
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more test suites failed"
            exit 1
          fi
          echo "All test suites passed"

  docker-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Tests
        working-directory: sportspress-schedule-generator/tests/docker
        run: |
          sed -i 's/\r$//' run-tests.sh
          chmod +x run-tests.sh
          sed -i 's/sleep 45/sleep 60/' run-tests.sh
          ./run-tests.sh

  league-manager-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and verify build output
        working-directory: sportspress-league-manager
        run: |
          npm ci
          npm run build
          git diff --exit-code build/
