name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token. gitleaks-action's pull_request scan lists the
# PR's commits via the API, which requires pull-requests: read in addition to
# contents: read (without it the action 403s on private repos).
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
