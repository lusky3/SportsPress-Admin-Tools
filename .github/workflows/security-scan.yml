name: Security Scanning

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
      # Dependency manifests: the SCA step resolves its graph from these, so a
      # deps-only change is exactly the change most likely to move this scan's
      # result. Without them a lockfile bump that fixes (or introduces) an
      # advisory never triggers the scanner that reports it.
      - '**/package.json'
      - '**/package-lock.json'
      # Policy files decide what the scan suppresses; editing one must re-run it.
      - '**/osv-scanner.toml'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
      # Dependency manifests: the SCA step resolves its graph from these, so a
      # deps-only change is exactly the change most likely to move this scan's
      # result. Without them a lockfile bump that fixes (or introduces) an
      # advisory never triggers the scanner that reports it.
      - '**/package.json'
      - '**/package-lock.json'
      # Policy files decide what the scan suppresses; editing one must re-run it.
      - '**/osv-scanner.toml'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sundays (full scan regardless of paths)

# Least-privilege default token: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Replaces the former snyk-code job (Snyk Code SAST + Snyk SCA against the
  # league-manager npm tree). Snyk Code SAST is dropped without replacement --
  # CodeQL, Semgrep and Codacy already cover that role in this repo's other
  # workflows. The SCA role moves to OSV-Scanner: free, no API token or
  # quota, so unlike Snyk it doesn't skip on Dependabot PRs (no Actions
  # secrets available there) and doesn't run out of monthly test budget.
  #
  # Two jobs, not one, because OSV-Scanner ships this as two purpose-built
  # reusable workflows: the "-pr" variant diffs against the target branch and
  # only fails on vulnerabilities the PR newly introduces; the plain variant
  # does a full scan and uploads SARIF to the Security > Code Scanning tab,
  # which needs `security-events: write` and only makes sense outside a PR
  # diff. This mirrors Snyk's old push/PR/weekly-cron coverage without
  # forcing one workflow to do both jobs.
  osv-scanner-pr:
    if: github.event_name == 'pull_request'
    needs: osv-scan-plan
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      scan-args: ${{ needs.osv-scan-plan.outputs.scan-args }}

  # The PR variant runs the same scan-args on the target branch and on the PR
  # head, and fails the job when either scan cannot complete (deliberately:
  # reporting "nothing new" off a scan that never ran is worse than a red
  # check). A lockfile present on only one side makes OSV-Scanner exit with
  # "failed to resolve path", so a PR that adds a brand-new lockfile (Player App's
  # app) could never go green. This job hands the scanner only lockfiles that
  # exist on BOTH sides. A lockfile with no base counterpart has nothing to
  # diff against: once on main it is covered by the push/weekly full scan, and
  # its production dependencies by the npm-audit job on the PR itself.
  osv-scan-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      scan-args: ${{ steps.plan.outputs.scan-args }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select lockfiles present on both the PR and its target branch
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A failed fetch aborts here (set -e) rather than reading as "no lockfiles".
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          args=""
          for lock in \
            sportspress-league-manager/package-lock.json \
            sportspress-player-app/app/package-lock.json; do
            if [ -f "$lock" ] && git cat-file -e "$BASE_SHA:$lock" 2>/dev/null; then
              args="${args}--lockfile=./${lock}"$'\n'
            else
              echo "::notice::Skipping $lock in the PR diff scan: not present on both the PR and its target branch."
            fi
          done
          if [ -z "$args" ]; then
            echo "::error::No lockfile is present on both the PR and its target branch; refusing to report a clean scan."
            exit 1
          fi
          {
            echo 'scan-args<<EOF'
            printf '%s' "$args"
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  osv-scanner-scheduled:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      scan-args: |-
        --lockfile=./sportspress-league-manager/package-lock.json
        --lockfile=./sportspress-player-app/app/package-lock.json

  npm-audit:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # `--omit=dev` is required because @wordpress/scripts transitively
      # depends on dev-only tools (markdownlint-cli, webpack-dev-server,
      # copy-webpack-plugin) that ship with HIGH-severity advisories. We
      # don't ship those to production. The advisories are tracked via
      # dependabot's npm ecosystem entry, which will surface bumps as
      # they're released upstream.
      - name: Install dependencies and audit (production only)
        working-directory: sportspress-league-manager
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      # Player App's PWA ships its built bundle, so production dependencies get the
      # same gate as League Manager's. Dev tooling (vite, vitest, jsdom) never
      # reaches users and is excluded the same way.
      - name: Install Player App dependencies and audit (production only)
        working-directory: sportspress-player-app/app
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
