name: Security Scanning

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
      # Dependency manifests: the SCA step resolves its graph from these, so a
      # deps-only change is exactly the change most likely to move this scan's
      # result. Without them a lockfile bump that fixes (or introduces) an
      # advisory never triggers the scanner that reports it.
      - '**/package.json'
      - '**/package-lock.json'
      # Policy files decide what the scan suppresses; editing one must re-run it.
      - '**/.snyk'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
      # Dependency manifests: the SCA step resolves its graph from these, so a
      # deps-only change is exactly the change most likely to move this scan's
      # result. Without them a lockfile bump that fixes (or introduces) an
      # advisory never triggers the scanner that reports it.
      - '**/package.json'
      - '**/package-lock.json'
      # Policy files decide what the scan suppresses; editing one must re-run it.
      - '**/.snyk'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sundays (full scan regardless of paths)

# Least-privilege default token: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk-code:
    runs-on: ubuntu-latest
    # Hoisted to job level so the steps below can test whether it is set.
    # GitHub does NOT expose Actions secrets to workflows triggered by
    # Dependabot pull requests — those runs read the separate *Dependabot*
    # secrets store, which is empty here. Without the guards below, every
    # Dependabot PR fails these steps with "Authentication error (SNYK-0005)",
    # which looks like a vulnerability finding and is not one.
    #
    # BETTER FIX, needs a repo admin: add SNYK_TOKEN under
    # Settings -> Secrets and variables -> Dependabot. Then these steps run on
    # dependency PRs too — which is where an SCA scan is most valuable — and
    # the guards become inert rather than load-bearing.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # snyk/actions is a monorepo; the root SHA is not a runnable action.
      # snyk/actions/node@<sha> is the right shape for both SAST (code test)
      # and SCA (test). We use a single language entry point and switch
      # behavior via the `command` arg.
      - name: Run Snyk Code (SAST)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          command: code test
          args: --severity-threshold=high

      # Snyk SCA (`test`) resolves the dependency graph from node_modules, so the
      # tree must be installed first — otherwise it errors with SNYK-CLI-0000
      # "Missing node_modules folder".
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install league-manager dependencies
        working-directory: sportspress-league-manager
        run: npm ci

      - name: Run Snyk SCA against the league-manager npm tree
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          command: test
          args: --severity-threshold=high --file=sportspress-league-manager/package.json

      # A skipped scan must not read as a clean scan. Without this the job goes
      # green having tested nothing, which is more dangerous than the auth
      # failure it replaces: green is what people trust.
      - name: Warn when Snyk was skipped
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::warning title=Snyk did not run::SNYK_TOKEN is unavailable, so \
          neither the SAST nor the SCA scan ran for this event. Dependabot pull \
          requests cannot read Actions secrets. This branch is still covered by \
          the push-to-main run and the weekly cron, and npm-audit ran normally. \
          To scan dependency PRs at PR time, add SNYK_TOKEN under Settings -> \
          Secrets and variables -> Dependabot."

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # `--omit=dev` is required because @wordpress/scripts transitively
      # depends on dev-only tools (markdownlint-cli, webpack-dev-server,
      # copy-webpack-plugin) that ship with HIGH-severity advisories. We
      # don't ship those to production. The advisories are tracked via
      # dependabot's npm ecosystem entry, which will surface bumps as
      # they're released upstream.
      - name: Install dependencies and audit (production only)
        working-directory: sportspress-league-manager
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
