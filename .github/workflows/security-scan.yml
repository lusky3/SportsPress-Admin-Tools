# Third-party actions pinned by tag; SHA-pin in follow-up commit. See AUDIT-REPORT-2026-05-pass2.md MEDIUM-1.
name: Security Scanning

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sundays (full scan regardless of paths)

jobs:
  snyk-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Snyk Code (SAST) to check for vulnerabilities
        uses: snyk/actions@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high

      - name: Run Snyk SCA (Open Source) to check dependencies
        uses: snyk/actions@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --all-projects --file=sportspress-league-manager/package.json

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and audit
        working-directory: sportspress-league-manager
        run: |
          npm ci
          npm audit --audit-level=high
