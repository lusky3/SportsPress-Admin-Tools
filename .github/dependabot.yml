version: 2
# All GitHub Actions — first- and third-party — are pinned to full commit SHAs
# with a trailing `# vX.Y.Z` version comment. Dependabot reads that comment to
# bump both the SHA and the comment on the weekly cadence below, so pinning
# stays current without manual SHA lookups (and satisfies Sonar php/actions
# S7637 "use full commit SHA hash").
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/sportspress-league-manager"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/sportspress-schedule-generator/tests/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
