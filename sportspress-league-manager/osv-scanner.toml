# OSV-Scanner config — https://google.github.io/osv-scanner/configuration/
#
# OSV-Scanner discovers this file the same way Snyk's own policy file
# (formerly sportspress-league-manager/.snyk, now removed) did: it looks for
# `osv-scanner.toml` in the SAME DIRECTORY as the lockfile being scanned, and
# does not walk up or propagate to child directories. Keep this file next to
# package-lock.json, not at the repo root.
#
# Every entry MUST carry an `ignoreUntil` date. An ignore that never lapses is
# a decision nobody revisits; a dated one forces the question again on a known
# day. When an entry expires the scan turns red again -- that is the point,
# and the fix is to re-evaluate, not to extend it reflexively.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4" # deepmerge prototype pollution
ignoreUntil = 2027-02-05
reason = """
Prototype pollution in deepmerge@4.3.1, reachable only through
@svgr/plugin-svgo, which @wordpress/scripts pulls in at build time. No fixed
version of deepmerge exists, so a dependency bump cannot resolve it.

Not shipped: dev-only (dev: true in package-lock.json); .distignore strips
node_modules and the package manifests from the packaged plugin.

Not exploitable here: deepmerge only merges svgo/SVGR configuration that is
committed to this repo during `npm run build`. It never processes untrusted
input and never runs on a WordPress site.

Revisit on expiry: check whether a patched deepmerge exists or
@svgr/plugin-svgo has dropped it.
"""
